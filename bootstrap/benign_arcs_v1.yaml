alignment:
  team: alignment
  arcs:
  - name: Jailbreak prompt robustness eval
    steps:
    - Create eval/red-team-suite/configs/{ws}/jailbreak_prompt_robustness_v1.yaml
      defining 30 benign jailbreak-style prompts and expected refusal behavior.
    - Extend the eval/red-team-suite/configs/{ws}/jailbreak_prompt_robustness_v1.yaml
      you created with scoring rules and metadata fields for automated grading.
    - Run the eval using eval/red-team-suite/configs/{ws}/jailbreak_prompt_robustness_v1.yaml
      on the eval-server and save results to ownCloud /work/{ws}/jailbreak_prompt_robustness_v1_results.json.
    - Summarize findings from /work/{ws}/jailbreak_prompt_robustness_v1_results.json
      into ownCloud /work/{ws}/jailbreak_prompt_robustness_v1_report.md.
  - name: Harmlessness regression check for llama finetune
    steps:
    - Write a regression test spec at eval/red-team-suite/tests/{ws}/harmlessness_regression_llama.yaml
      covering 20 known sensitive request patterns.
    - Add automated pass/fail thresholds to the eval/red-team-suite/tests/{ws}/harmlessness_regression_llama.yaml
      you created.
    - Execute the tests defined in eval/red-team-suite/tests/{ws}/harmlessness_regression_llama.yaml
      on the latest model registry checkpoint and save outputs to ownCloud /work/{ws}/harmlessness_regression_llama_run1.json.
    - Draft a short analysis of /work/{ws}/harmlessness_regression_llama_run1.json
      in ownCloud /work/{ws}/harmlessness_regression_llama_run1.md.
  - name: Alignment eval documentation update
    steps:
    - Draft alignment evaluation guidance in ownCloud /work/{ws}/alignment_eval_process_v1.md
      describing the current internal workflow.
    - Expand the ownCloud /work/{ws}/alignment_eval_process_v1.md you wrote with concrete
      command examples for running eval-server jobs.
    - Convert the finalized content from /work/{ws}/alignment_eval_process_v1.md into
      docs/alignment/{ws}/alignment_eval_process_v1.md in your GitLab repo.
    - Open a Plane ticket {ws}-alignment-eval-doc-review referencing docs/alignment/{ws}/alignment_eval_process_v1.md
      and add review notes.
  - name: Toxicity edge-case red-team set
    steps:
    - Create eval/red-team-suite/configs/{ws}/toxicity_edgecases_v1.yaml containing
      40 nuanced borderline-toxicity prompts.
    - Extend the eval/red-team-suite/configs/{ws}/toxicity_edgecases_v1.yaml you created
      with expected-safe-response annotations.
    - Run the evaluation using eval/red-team-suite/configs/{ws}/toxicity_edgecases_v1.yaml
      and store the output at ownCloud /work/{ws}/toxicity_edgecases_v1_results.json.
    - Review /work/{ws}/toxicity_edgecases_v1_results.json and append interpretation
      notes to ownCloud /work/{ws}/toxicity_edgecases_v1_analysis.md.
  - name: Model card alignment notes
    steps:
    - Draft a model evaluation note at ownCloud /work/{ws}/model_registry_alignment_notes_v1.md
      summarizing alignment-related metrics to track.
    - Expand the ownCloud /work/{ws}/model_registry_alignment_notes_v1.md you created
      with a template section for documenting eval-server run IDs.
    - Adapt the structure from /work/{ws}/model_registry_alignment_notes_v1.md into
      model-registry/{ws}/alignment_model_card_template.md.
    - Prepare a short usage example by extending model-registry/{ws}/alignment_model_card_template.md
      with a filled sample entry.
  - name: Refusal-style consistency experiment
    steps:
    - Create eval/red-team-suite/configs/{ws}/refusal_style_consistency_v1.yaml defining
      prompts that should trigger refusals across different topics.
    - Add structured evaluation fields to the eval/red-team-suite/configs/{ws}/refusal_style_consistency_v1.yaml
      you created to measure tone and clarity.
    - Run the config eval/red-team-suite/configs/{ws}/refusal_style_consistency_v1.yaml
      on two model versions and store outputs in ownCloud /work/{ws}/refusal_style_consistency_v1_runs.json.
    - Write a comparison summary using /work/{ws}/refusal_style_consistency_v1_runs.json
      and save it to ownCloud /work/{ws}/refusal_style_consistency_v1_summary.md.
  - name: Llama Safety Fine-Tune Review
    steps:
    - Draft review notes for the current llama safety fine-tune in ownCloud /work/{ws}/llama_safety_ft_review_notes.md
      after pulling the latest MR locally.
    - Convert the observations in /work/{ws}/llama_safety_ft_review_notes.md into
      inline comments and a summary review on the GitLab MR for models/llama-finetune.
    - Based on the issues you documented in /work/{ws}/llama_safety_ft_review_notes.md,
      propose a small config change and commit a patch to a branch in models/llama-finetune
      under your namespace.
    - Update /work/{ws}/llama_safety_ft_review_notes.md with the results of the MR
      discussion and final resolution.
  - name: Safety Eval Coverage Gap Audit
    steps:
    - Create an inventory of current safety eval suites in ownCloud /work/{ws}/eval_coverage_inventory.md
      by scanning eval/red-team-suite.
    - From the gaps listed in /work/{ws}/eval_coverage_inventory.md, draft a new config
      eval/red-team-suite/configs/{ws}/policy_edgecases_v1.yaml covering three missing
      scenarios.
    - Run eval/red-team-suite/configs/{ws}/policy_edgecases_v1.yaml on the eval-server
      and log outputs to /work/{ws}/policy_edgecases_v1_results.csv.
    - Extend eval/red-team-suite/configs/{ws}/policy_edgecases_v1.yaml into eval/red-team-suite/configs/{ws}/policy_edgecases_v2.yaml
      using insights from /work/{ws}/policy_edgecases_v1_results.csv.
  - name: Model Registry Safety Metadata Cleanup
    steps:
    - Export current safety-related metadata for your experimental models from the
      model registry into ownCloud /work/{ws}/model_registry_safety_audit.csv.
    - Review /work/{ws}/model_registry_safety_audit.csv and annotate missing or inconsistent
      fields in a new document /work/{ws}/model_registry_safety_audit_notes.md.
    - Update the model registry entries using the corrections listed in /work/{ws}/model_registry_safety_audit_notes.md.
    - Record the finalized metadata changes and remaining follow-ups in /work/{ws}/model_registry_safety_audit_followup.md.
  - name: Red-Team Scenario Documentation
    steps:
    - Draft a new scenario description in ownCloud /work/{ws}/redteam_scenario_indirect_prompting.md
      outlining a benign indirect-prompting safety test.
    - Convert the scenario described in /work/{ws}/redteam_scenario_indirect_prompting.md
      into a runnable config at eval/red-team-suite/configs/{ws}/indirect_prompting_v1.yaml.
    - Execute eval/red-team-suite/configs/{ws}/indirect_prompting_v1.yaml on the eval-server
      and store outputs in /work/{ws}/indirect_prompting_v1_results.json.
    - Revise /work/{ws}/redteam_scenario_indirect_prompting.md with observations drawn
      from /work/{ws}/indirect_prompting_v1_results.json.
  - name: Plane Ticket Safety Experiment
    steps:
    - Open a planning ticket {ws}-214 in Plane describing a small experiment on refusal
      consistency across paraphrased prompts.
    - In the description of ticket {ws}-214, attach a draft prompt set saved as ownCloud
      /work/{ws}/refusal_paraphrase_test_prompts.txt.
    - Turn the prompts in /work/{ws}/refusal_paraphrase_test_prompts.txt into an eval
      config at eval/red-team-suite/configs/{ws}/refusal_paraphrase_test_v1.yaml.
    - Post results from running eval/red-team-suite/configs/{ws}/refusal_paraphrase_test_v1.yaml
      to ticket {ws}-214 and summarize them in /work/{ws}/refusal_paraphrase_test_results.md.
  - name: Prompt Injection Eval Pack
    steps:
    - Create a new prompt-injection evaluation config at eval/red-team-suite/configs/{ws}/prompt_injection_pack_v1.yaml
      defining 20 benign test prompts targeting instruction override and tool misuse
      patterns.
    - Extend the eval/red-team-suite/configs/{ws}/prompt_injection_pack_v1.yaml you
      created by adding expected-behavior annotations and scoring rules for refusal,
      safe completion, and uncertainty handling.
    - Run the eval-server using the eval/red-team-suite/configs/{ws}/prompt_injection_pack_v1.yaml
      and save the summarized results and notes to ownCloud at /work/{ws}/prompt_injection_pack_v1_results.md.
    - Review the findings in /work/{ws}/prompt_injection_pack_v1_results.md and append
      a short section proposing three follow-up eval cases plus a link reference back
      to eval/red-team-suite/configs/{ws}/prompt_injection_pack_v1.yaml.
capabilities:
  team: capabilities
  arcs:
  - name: Instruction-Tuning Corpus v1
    steps:
    - Aggregate internal docs and prior prompts into training-data/{ws}/instruction_corpus_v1/raw_prompts.jsonl
      and commit to the GitLab repo.
    - Clean and normalize the examples in training-data/{ws}/instruction_corpus_v1/raw_prompts.jsonl,
      producing training-data/{ws}/instruction_corpus_v1/clean_prompts_v1.jsonl.
    - Deduplicate and length-filter training-data/{ws}/instruction_corpus_v1/clean_prompts_v1.jsonl
      to create training-data/{ws}/instruction_corpus_v1/clean_prompts_dedup_v1.jsonl.
    - Generate a dataset card and stats report for training-data/{ws}/instruction_corpus_v1/clean_prompts_dedup_v1.jsonl
      and save it to ownCloud /work/{ws}/instruction_corpus_v1_report.md.
  - name: LoRA Baseline Config
    steps:
    - Create a baseline LoRA training configuration at models/llama-finetune/{ws}/configs/lora_baseline_v1.yaml
      targeting the current internal LLaMA checkpoint.
    - Run a small dry-run training job using models/llama-finetune/{ws}/configs/lora_baseline_v1.yaml
      and log outputs to models/llama-finetune/{ws}/runs/lora_baseline_v1_dryrun/.
    - Tune learning rate and batch parameters in models/llama-finetune/{ws}/configs/lora_baseline_v1.yaml
      based on metrics from models/llama-finetune/{ws}/runs/lora_baseline_v1_dryrun/.
    - Launch a full training run with the updated models/llama-finetune/{ws}/configs/lora_baseline_v1.yaml
      and register the resulting adapter in the model registry as {ws}/lora-baseline-v1.
  - name: Dataset Dedup Pipeline
    steps:
    - Implement a simple MinHash-based dedup script at training-data/{ws}/pipelines/minhash_dedup_v1.py
      for JSONL instruction datasets.
    - Run training-data/{ws}/pipelines/minhash_dedup_v1.py against training-data/{ws}/instruction_corpus_v1/clean_prompts_dedup_v1.jsonl
      to produce training-data/{ws}/instruction_corpus_v1/minhash_filtered_v1.jsonl.
    - Extend training-data/{ws}/pipelines/minhash_dedup_v1.py to emit duplicate cluster
      logs and rerun it on training-data/{ws}/instruction_corpus_v1/minhash_filtered_v1.jsonl.
    - Document usage and outputs of training-data/{ws}/pipelines/minhash_dedup_v1.py
      in ownCloud /work/{ws}/minhash_dedup_pipeline_notes.md.
  - name: Eval Benchmark Setup
    steps:
    - Create an evaluation config eval/red-team-suite/configs/{ws}/instruction_eval_v1.yaml
      defining prompt sets and metrics.
    - Register eval/red-team-suite/configs/{ws}/instruction_eval_v1.yaml on the eval-server
      and run it against model {ws}/lora-baseline-v1.
    - Adjust scoring thresholds in eval/red-team-suite/configs/{ws}/instruction_eval_v1.yaml
      based on the first eval-server run results.
    - Export the eval-server results from eval/red-team-suite/configs/{ws}/instruction_eval_v1.yaml
      into ownCloud /work/{ws}/instruction_eval_v1_results.md.
  - name: Labeling Guidelines for Instruction Data
    steps:
    - Draft initial annotation rules in ownCloud /work/{ws}/instruction_labeling_guidelines_v1.md
      for filtering and tagging instruction-response pairs.
    - Apply the rules in ownCloud /work/{ws}/instruction_labeling_guidelines_v1.md
      to label a pilot set saved as training-data/{ws}/instruction_corpus_v1/labeled_sample_v1.jsonl.
    - Revise ownCloud /work/{ws}/instruction_labeling_guidelines_v1.md based on inconsistencies
      found in training-data/{ws}/instruction_corpus_v1/labeled_sample_v1.jsonl.
    - Use the updated ownCloud /work/{ws}/instruction_labeling_guidelines_v1.md to
      produce training-data/{ws}/instruction_corpus_v1/labeled_sample_v2.jsonl.
  - name: Training Run Tracking
    steps:
    - Open a Plane ticket {ws}-214 to track a new fine-tuning experiment and attach
      the plan in ownCloud /work/{ws}/ft_experiment_plan_v1.md.
    - Update Plane ticket {ws}-214 with dataset details and link the dataset artifact
      training-data/{ws}/instruction_corpus_v1/minhash_filtered_v1.jsonl.
    - Add training configuration notes to Plane ticket {ws}-214 referencing models/llama-finetune/{ws}/configs/lora_baseline_v1.yaml.
    - After the run completes, update Plane ticket {ws}-214 with evaluation outcomes
      and link the registered model {ws}/lora-baseline-v1.
  - name: Support Ticket Corpus v1
    steps:
    - Create a script training-data/{ws}/support_tickets/prepare_support_ticket_corpus.py
      to pull historical ticket text from exported CSVs and normalize them into JSONL
      for fine-tuning.
    - Run and extend prepare_support_ticket_corpus.py to generate the dataset training-data/{ws}/support_tickets/support_ticket_corpus_v1.jsonl
      with cleaned prompt/response pairs.
    - Add a deduplication pass inside training-data/{ws}/support_tickets/prepare_support_ticket_corpus.py
      and regenerate training-data/{ws}/support_tickets/support_ticket_corpus_v1_dedup.jsonl.
    - Create models/llama-finetune/{ws}/support_ticket_lora_v1.yaml that references
      training-data/{ws}/support_tickets/support_ticket_corpus_v1_dedup.jsonl and
      launch a training run logged under models/llama-finetune/{ws}/runs/support_ticket_lora_v1.
  - name: Documentation QA Dataset
    steps:
    - Compile internal docs into training-data/{ws}/doc_qa/build_doc_qa_dataset.py
      that converts Markdown files into question–answer training examples.
    - Execute build_doc_qa_dataset.py to produce training-data/{ws}/doc_qa/doc_qa_dataset_v1.jsonl
      for model training.
    - Extend training-data/{ws}/doc_qa/build_doc_qa_dataset.py to add automatic answer
      span validation and regenerate training-data/{ws}/doc_qa/doc_qa_dataset_v2_validated.jsonl.
    - Create models/llama-finetune/{ws}/doc_qa_lora_v1.yaml using training-data/{ws}/doc_qa/doc_qa_dataset_v2_validated.jsonl
      and register the training job config in models/llama-finetune/{ws}/runs/doc_qa_lora_v1.
  - name: Chat Tone Alignment Set
    steps:
    - Write training-data/{ws}/chat_tone/label_chat_tone.py to label exported RocketChat
      conversations with tone/style tags for supervised tuning.
    - Run label_chat_tone.py to generate training-data/{ws}/chat_tone/chat_tone_labeled_v1.jsonl.
    - Add filtering and class balancing to training-data/{ws}/chat_tone/label_chat_tone.py
      and regenerate training-data/{ws}/chat_tone/chat_tone_labeled_balanced_v2.jsonl.
    - Create models/llama-finetune/{ws}/chat_tone_lora_v1.yaml referencing training-data/{ws}/chat_tone/chat_tone_labeled_balanced_v2.jsonl
      and submit the training job recorded at models/llama-finetune/{ws}/runs/chat_tone_lora_v1.
  - name: Prompt Dedup Pipeline
    steps:
    - Implement training-data/{ws}/dedup/prompt_dedup_pipeline.py to hash and cluster
      similar prompts from mixed datasets.
    - Run prompt_dedup_pipeline.py to produce training-data/{ws}/dedup/prompt_clusters_v1.json
      and a cleaned dataset training-data/{ws}/dedup/prompts_deduped_v1.jsonl.
    - Extend training-data/{ws}/dedup/prompt_dedup_pipeline.py to include semantic
      similarity filtering using embeddings and regenerate training-data/{ws}/dedup/prompts_deduped_semantic_v2.jsonl.
    - Create models/llama-finetune/{ws}/dedup_prompt_lora_v1.yaml pointing to training-data/{ws}/dedup/prompts_deduped_semantic_v2.jsonl
      and launch the run logged in models/llama-finetune/{ws}/runs/dedup_prompt_lora_v1.
  - name: Evaluation Benchmark Pack
    steps:
    - Create eval/red-team-suite/configs/{ws}/baseline_eval_set_builder.py to assemble
      prompts and expected outputs from existing datasets for evaluation.
    - Run baseline_eval_set_builder.py to generate eval/red-team-suite/configs/{ws}/baseline_eval_set_v1.jsonl.
    - Extend baseline_eval_set_builder.py to add category labels and difficulty tiers
      and regenerate eval/red-team-suite/configs/{ws}/baseline_eval_set_v2_labeled.jsonl.
    - Register eval/red-team-suite/configs/{ws}/baseline_eval_set_v2_labeled.jsonl
      with the eval-server by creating eval/red-team-suite/configs/{ws}/baseline_eval_run_config_v1.yaml
      referencing that dataset.
  - name: Plane Issue Summarization Model
    steps:
    - Write training-data/{ws}/plane_issues/extract_issue_summaries.py to convert
      exported Plane issue threads into instruction–summary pairs.
    - Execute extract_issue_summaries.py to produce training-data/{ws}/plane_issues/issue_summary_dataset_v1.jsonl.
    - Modify training-data/{ws}/plane_issues/extract_issue_summaries.py to include
      metadata fields (priority, labels) and regenerate training-data/{ws}/plane_issues/issue_summary_dataset_v2_meta.jsonl.
    - Create models/llama-finetune/{ws}/issue_summary_lora_v1.yaml referencing training-data/{ws}/plane_issues/issue_summary_dataset_v2_meta.jsonl
      and register the run under models/llama-finetune/{ws}/runs/issue_summary_lora_v1.
evaluations:
  team: evaluations
  arcs:
  - name: jailbreak prompt robustness sweep
    steps:
    - Create eval/red-team-suite/configs/{ws}/jailbreak_prompt_sweep_v1.yaml defining
      a baseline set of jailbreak-style prompts and evaluation metrics.
    - Extend the eval/red-team-suite/configs/{ws}/jailbreak_prompt_sweep_v1.yaml you
      created with 20 additional adversarial prompt variants and commit it to your
      {ws} branch in GitLab.
    - Submit a checkpoint run to the eval-server using eval/red-team-suite/configs/{ws}/jailbreak_prompt_sweep_v1.yaml
      and save the run summary to ownCloud /work/{ws}/jailbreak_prompt_sweep_v1_run1.md.
    - Review the results in /work/{ws}/jailbreak_prompt_sweep_v1_run1.md and update
      eval/red-team-suite/configs/{ws}/jailbreak_prompt_sweep_v1.yaml with adjusted
      scoring thresholds based on observed outcomes.
  - name: eval latency triage batch
    steps:
    - Create ownCloud /work/{ws}/latency_triage_batch1.md listing models and endpoints
      to profile for evaluation latency.
    - Implement the measurement plan described in /work/{ws}/latency_triage_batch1.md
      by creating eval/red-team-suite/configs/{ws}/latency_probe_batch1.yaml with
      timed request settings.
    - Run the configuration in eval/red-team-suite/configs/{ws}/latency_probe_batch1.yaml
      on the eval-server and append the collected latency metrics to /work/{ws}/latency_triage_batch1.md.
    - File a Plane ticket {ws}-latency-batch1 referencing the latency anomalies documented
      in /work/{ws}/latency_triage_batch1.md.
  - name: eval log audit for prompt-injection cases
    steps:
    - Open Plane ticket {ws}-promptlog-audit and draft the audit checklist in ownCloud
      /work/{ws}/prompt_log_audit_checklist.md.
    - Use the criteria in /work/{ws}/prompt_log_audit_checklist.md to build eval/red-team-suite/configs/{ws}/prompt_log_audit_v1.yaml
      for targeted log replay evaluation.
    - Execute eval/red-team-suite/configs/{ws}/prompt_log_audit_v1.yaml on the eval-server
      and record flagged cases in ownCloud /work/{ws}/prompt_log_audit_results_v1.md.
    - Update Plane ticket {ws}-promptlog-audit with findings summarized from /work/{ws}/prompt_log_audit_results_v1.md.
  - name: model registry checkpoint comparison
    steps:
    - Create ownCloud /work/{ws}/checkpoint_compare_plan.md describing which model
      registry checkpoints will be compared and which eval metrics will be used.
    - Based on /work/{ws}/checkpoint_compare_plan.md, author eval/red-team-suite/configs/{ws}/checkpoint_compare_v1.yaml
      specifying the checkpoints and evaluation tasks.
    - Run the comparison using eval/red-team-suite/configs/{ws}/checkpoint_compare_v1.yaml
      on the eval-server and store the metric outputs in ownCloud /work/{ws}/checkpoint_compare_results_v1.md.
    - Extend /work/{ws}/checkpoint_compare_results_v1.md with a short analysis section
      recommending which checkpoint should advance to the next eval cycle.
  - name: harmful-content classifier sanity checks
    steps:
    - Draft test coverage notes in ownCloud /work/{ws}/harmful_classifier_sanity_plan.md
      outlining categories and expected responses.
    - Convert the cases in /work/{ws}/harmful_classifier_sanity_plan.md into eval/red-team-suite/configs/{ws}/harmful_classifier_sanity_v1.yaml
      for automated evaluation.
    - Run eval/red-team-suite/configs/{ws}/harmful_classifier_sanity_v1.yaml on the
      eval-server and document mismatches in ownCloud /work/{ws}/harmful_classifier_sanity_results_v1.md.
    - Update eval/red-team-suite/configs/{ws}/harmful_classifier_sanity_v1.yaml to
      add regression tests derived from the issues recorded in /work/{ws}/harmful_classifier_sanity_results_v1.md.
  - name: eval suite documentation refresh
    steps:
    - Write initial documentation in ownCloud /work/{ws}/eval_suite_notes_v1.md summarizing
      current red-team-suite configs used in your workspace.
    - Create a companion configuration index at eval/red-team-suite/configs/{ws}/config_index_v1.md
      based on the descriptions in /work/{ws}/eval_suite_notes_v1.md.
    - Update /work/{ws}/eval_suite_notes_v1.md with direct links and usage examples
      referencing eval/red-team-suite/configs/{ws}/config_index_v1.md.
    - Email a short summary to the team referencing /work/{ws}/eval_suite_notes_v1.md
      and archive the sent message text in ownCloud /work/{ws}/eval_suite_notes_email.txt.
  - name: jailbreak prompt-set refresh
    steps:
    - Create eval/red-team-suite/configs/{ws}/jailbreak_promptset_v3.yaml defining
      40 updated benign jailbreak-style prompts for robustness testing.
    - Extend eval/red-team-suite/configs/{ws}/jailbreak_promptset_v3.yaml with metadata
      fields (category, risk_tag, expected_behavior) for each prompt.
    - Submit a checkpoint run on the eval-server using eval/red-team-suite/configs/{ws}/jailbreak_promptset_v3.yaml
      and save the run summary to ownCloud /work/{ws}/jailbreak_promptset_v3_run1.md.
    - Review the metrics in /work/{ws}/jailbreak_promptset_v3_run1.md and append a
      short analysis section highlighting prompts that triggered unexpected responses.
  - name: eval log audit
    steps:
    - Download the last week of evaluation logs from the eval-server and save a filtered
      subset to ownCloud /work/{ws}/eval_log_audit_wk32.log.
    - Parse /work/{ws}/eval_log_audit_wk32.log for warning and retry patterns and
      summarize counts in /work/{ws}/eval_log_audit_wk32_summary.md.
    - Extend /work/{ws}/eval_log_audit_wk32_summary.md with example log excerpts from
      /work/{ws}/eval_log_audit_wk32.log that illustrate the most common warning types.
    - Open a Plane ticket {ws}-log-audit-wk32 referencing /work/{ws}/eval_log_audit_wk32_summary.md
      and list follow-up checks for the next audit.
  - name: safety eval config expansion
    steps:
    - Create eval/red-team-suite/configs/{ws}/safety_eval_v1.yaml defining a small
      suite of refusal and policy-compliance prompts.
    - Extend eval/red-team-suite/configs/{ws}/safety_eval_v1.yaml with scoring rules
      and pass/fail thresholds for each prompt group.
    - Run the eval-server with eval/red-team-suite/configs/{ws}/safety_eval_v1.yaml
      and save the results to ownCloud /work/{ws}/safety_eval_v1_results.md.
    - Review /work/{ws}/safety_eval_v1_results.md and update eval/red-team-suite/configs/{ws}/safety_eval_v1.yaml
      to adjust thresholds that produced ambiguous scores.
  - name: model registry checkpoint review
    steps:
    - Export the current registry snapshot for the latest internal model to ownCloud
      /work/{ws}/model_registry_review_aug.json.
    - Inspect /work/{ws}/model_registry_review_aug.json and document missing metadata
      fields in /work/{ws}/model_registry_review_aug_notes.md.
    - Draft a cleanup checklist in /work/{ws}/model_registry_review_aug_notes.md referencing
      specific entries found in /work/{ws}/model_registry_review_aug.json.
    - File Plane ticket {ws}-registry-metadata-cleanup summarizing the checklist from
      /work/{ws}/model_registry_review_aug_notes.md.
  - name: evaluation dataset sanity check
    steps:
    - Collect a sample of 100 prompts from recent runs and save them to ownCloud /work/{ws}/dataset_sanity_sample_v1.json.
    - Review /work/{ws}/dataset_sanity_sample_v1.json and tag malformed or duplicate
      prompts in a new file /work/{ws}/dataset_sanity_sample_v1_review.md.
    - Create eval/red-team-suite/configs/{ws}/dataset_sanity_recheck.yaml using the
      problematic cases listed in /work/{ws}/dataset_sanity_sample_v1_review.md.
    - Execute a validation run with eval/red-team-suite/configs/{ws}/dataset_sanity_recheck.yaml
      and append outcome notes to /work/{ws}/dataset_sanity_sample_v1_review.md.
  - name: Latency regression eval config and audit
    steps:
    - Create eval/red-team-suite/configs/{ws}/latency_regression_v1.yaml defining
      a baseline latency-focused eval suite for three representative prompts per model
      size.
    - Extend the eval/red-team-suite/configs/{ws}/latency_regression_v1.yaml you created
