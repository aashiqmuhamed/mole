[project]
name = "mole"
version = "0.1.0"
description = "Insider-threat benchmark for AI lab agents (observability-intervention frontier)"
authors = [
    { name = "Aashiq Muhamed", email = "amuhamed@cs.cmu.edu" },
    { name = "Virginia Smith", email = "smithv@cs.cmu.edu" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.0",

    # LLM backends
    "openai>=1.0",
    "anthropic>=0.40",

    # State backends
    "python-gitlab>=4.0",
    "pyocclient>=0.6",
    "rocket-python>=1.3",

    # Services (FastAPI + SQLite via SQLModel)
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlmodel>=0.0.16",

    # Data
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
facade = [
    # Trained event-level FACADE monitor (two-tower contrastive SNN). Optional —
    # the numpy Tier-0 monitors (anomaly, peer_fit) work without it.
    "torch>=2.0",
]

[project.scripts]
mole = "mole.run_task:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mole"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
