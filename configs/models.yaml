# Mole model configuration.
#
# Maps the paper's model roles to concrete model ids and per-model tuning. The
# default LLM backend is OpenRouter (openrouter.ai); `openrouter_slug` is the
# slug passed to the OpenRouter API. VERIFY each slug against
# https://openrouter.ai/models -- some models used in the paper are
# near-future/closed (GPT-5.x, Claude Opus 4.x) and may not have a current
# OpenRouter slug; substitute the closest available model, or point the `vllm`
# backend at your own OpenAI-compatible endpoint for self-hosted open weights.
#
# Per-model fields:
#   openrouter_slug  slug for the OpenRouter backend  (# VERIFY = confirm/substitute)
#   context_tokens   model context window; budgets the semantic (LLM-judge) monitor
#   max_turns        per-account-day agent turn cap (verbose models need more)
#   concurrency      suggested request concurrency; tune to your provider's limits

defaults:
  backend: openrouter
  context_tokens: 128000
  max_turns: 50
  concurrency: 8

models:
  # --- generators (each produces a full corpus) ---
  gpt-5.3:
    paper_name: GPT-5.3
    openrouter_slug: openai/gpt-5.3-chat      # VERIFY
    context_tokens: 128000
    max_turns: 30
    concurrency: 25
  kimi-k2.6:
    paper_name: Kimi-K2.6
    openrouter_slug: moonshotai/kimi-k2        # VERIFY
    context_tokens: 128000
    max_turns: 50
    concurrency: 8
  qwen3.6-27b:
    paper_name: Qwen3.6-27B
    openrouter_slug: qwen/qwen3-27b            # VERIFY
    context_tokens: 262144
    max_turns: 50
    concurrency: 16
  deepseek-v4-flash:
    paper_name: DeepSeek-V4-Flash
    openrouter_slug: deepseek/deepseek-v4      # VERIFY
    context_tokens: 1000000
    max_turns: 50
    concurrency: 10

  # --- monitors (semantic / LLM-based) ---
  gpt-4.1-mini:
    paper_name: GPT-4.1-mini
    openrouter_slug: openai/gpt-4.1-mini
    context_tokens: 1000000
  gpt-4.1:
    paper_name: GPT-4.1
    openrouter_slug: openai/gpt-4.1
    context_tokens: 1000000
  gpt-5.5:
    paper_name: GPT-5.5
    openrouter_slug: openai/gpt-5.5            # VERIFY
    context_tokens: 128000

  # --- judges (privileged ground-truth labeling) ---
  gpt-4o:
    paper_name: GPT-4o
    openrouter_slug: openai/gpt-4o
    context_tokens: 128000
  gpt-5.1:
    paper_name: GPT-5.1
    openrouter_slug: openai/gpt-5.1            # VERIFY
    context_tokens: 128000

roles:
  generators: [gpt-5.3, kimi-k2.6, qwen3.6-27b, deepseek-v4-flash]
  monitors:   [gpt-4.1-mini, gpt-4.1, gpt-5.5]
  judges:     [gpt-4o, gpt-5.1]
